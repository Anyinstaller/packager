[package]
name = "anyinstaller-packager"
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
license = "MPL-2.0"
description = "Builds signed AIP v1 single-file installers"
repository = "https://github.com/Anyinstaller/packager"

[[bin]]
name = "packager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.4"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "ico",
] }
oxideav-avif = "0.0.18"
sha2 = "0.10"
tempfile = "3.27"
toml = "0.8"
toml_edit = "0.22"
walkdir = "2.5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
] }
zip = { version = "9.8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
codegen-units = 1
